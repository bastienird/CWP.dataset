# Runs the test suite and writes a readable report on the summary page of the
# run (Actions tab, or the "Details" link of the check on a pull request).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: tests

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat, local::.
          needs: check

      - name: Run tests and write the report
        run: Rscript .github/scripts/test-report.R

      # The report of a tiny example job, to look at before merging: download
      # the "example-report" artifact of the run and open index.html
      - name: Render the example report
        if: always()
        continue-on-error: true
        run: Rscript .github/scripts/example-report.R example-report

      - name: Upload the example report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-report
          path: example-report
          if-no-files-found: warn
