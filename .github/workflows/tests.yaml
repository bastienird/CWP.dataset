# Runs the test suite and writes a readable report on the summary page of the
# run (Actions tab, or the "Details" link of the check on a pull request).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: tests

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat
          needs: check

      - name: Run tests and write the report
        run: Rscript .github/scripts/test-report.R
